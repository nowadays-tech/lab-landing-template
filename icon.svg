<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- lucide-static v1.32.0, archive. ISC. The same mark index.html carries as
       an inline data: URI, written out as a file to copy into a real project.
       Two changes worth keeping when you swap the glyph:

       - Stroke thickened from 2 to 2.25. Lucide is drawn for 24px; at 16px in a
         tab the default weight breaks up.
       - The prefers-color-scheme rule lives inside the SVG, because a black
         mark is invisible on a dark tab bar. It matches the viewer's system
         theme, not the page's background — this page is light either way. -->
  <style>
    * { stroke: #000; }
    @media (prefers-color-scheme: dark) { * { stroke: #fff; } }
  </style>
  <g fill="none" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
    <rect width="20" height="5" x="2" y="3" rx="1"/>
    <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/>
    <path d="M10 12h4"/>
  </g>
</svg>
